<!DOCTYPE html>
<html lang="es" data-theme="corporate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PMI Portfolio & CV Platform | Hojas de Vida Dinámicas</title>
  
  <!-- Meta Tags Open Graph Dinámicos -->
  <meta property="og:title" content="Plataforma de Hojas de Vida Dinámicas (Estándar PMI)" id="og-title" />
  <meta property="og:description" content="Portafolio ejecutivo de dirección de proyectos, KPIs, certificaciones y competencias bajo estándares PMI." id="og-desc" />
  <meta property="og:type" content="profile" />
  <meta property="og:url" content="" id="og-url" />

  <!-- Google Fonts (5 opciones seleccionables desde Apariencia) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:wght@300;400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Librerías por CDN: Lucide Icons y QRCode -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <style>
    /* ==========================================================================
       1. VARIABLES CSS Y SISTEMA DE DISEÑO (:root)
       ========================================================================== */
    :root {
      --primary: #0f4c81;       /* Azul corporativo PMI */
      --secondary: #1e293b;     /* Slate oscuro */
      --accent: #d97706;        /* Ámbar ejecutivo para logros/KPIs */
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-muted: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #e2e8f0;
      --radius: 12px;           /* Configurable: 12px (Redondeado) o 2px (Cuadrado) */
      --avatar-radius: 50%;     /* 50% (Circular) o 6px (Cuadrado) */
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Tema Oscuro */
    [data-theme="dark"] {
      --bg-body: #0b1120;
      --bg-card: #1e293b;
      --bg-muted: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.4);
    }

    /* Tema Corporativo (Alto contraste limpio) */
    [data-theme="corporate"] {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-muted: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #334155;
      --border-color: #cbd5e1;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       2. RESET Y ESTILOS BASE
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-family: var(--font-main);
      color: var(--text-main);
      background-color: var(--bg-body);
      line-height: 1.6;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color var(--transition), color var(--transition);
    }

    a {
      color: var(--primary);
      text-decoration: none;
      transition: opacity var(--transition);
    }

    a:hover {
      opacity: 0.85;
      text-decoration: underline;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 0.95rem;
      color: inherit;
    }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* ==========================================================================
       3. BARRA SUPERIOR DE NAVEGACIÓN GLOBAL
       ========================================================================== */
    .top-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary);
      text-decoration: none !important;
    }

    .brand-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--primary);
      color: #fff;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .mode-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      cursor: pointer;
      user-select: none;
    }

    .mode-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    .mode-dot.demo {
      background: var(--accent);
    }

    /* ==========================================================================
       4. BOTONES Y COMPONENTES COMUNES
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.88rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none !important;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .btn-secondary {
      background: var(--bg-muted);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--border-color);
    }

    .btn-accent {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-danger {
      background: #ef4444;
      color: #ffffff;
    }

    .btn-sm {
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg-muted);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .badge-agile { background: #dcfce7; color: #166534; border-color: #86efac; }
    .badge-predictive { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
    .badge-hybrid { background: #fef3c7; color: #92400e; border-color: #fde68a; }

    /* ==========================================================================
       5. CONTENEDOR PRINCIPAL Y DIRECTORIO (#/)
       ========================================================================== */
    .main-container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem;
      flex: 1;
    }

    .directory-hero {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: var(--radius);
      margin-bottom: 2rem;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .directory-hero h1 {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      margin-bottom: 0.5rem;
    }

    .directory-hero p {
      opacity: 0.9;
      max-width: 680px;
      margin: 0 auto 1.5rem;
    }

    .search-bar {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
      background: #ffffff;
      padding: 0.4rem;
      border-radius: var(--radius);
    }

    .search-bar input {
      flex: 1;
      border: none;
      padding: 0.6rem 0.8rem;
      color: #0f172a;
      background: transparent;
      outline: none;
    }

    .directory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .profile-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .profile-card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .profile-card-avatar {
      width: 68px;
      height: 68px;
      border-radius: var(--avatar-radius);
      object-fit: cover;
      border: 2px solid var(--primary);
      flex-shrink: 0;
    }

    /* ==========================================================================
       6. HOJA DE VIDA PÚBLICA (#/cv/{slug})
       ========================================================================== */
    /* Barra de navegación rápida de secciones (Scroll Spy) */
    .cv-subnav {
      position: sticky;
      top: 57px;
      z-index: 90;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.5rem 0.8rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    .section-anchors {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .section-anchor {
      padding: 0.35rem 0.7rem;
      border-radius: var(--radius);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      text-decoration: none !important;
      transition: all var(--transition);
    }

    .section-anchor:hover, .section-anchor.active {
      background: var(--primary);
      color: #ffffff;
    }

    .accordion-controls {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    /* Layout del CV: Barra lateral + Contenido principal o 1 sola columna */
    .cv-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.75rem;
      align-items: start;
    }

    .cv-layout.single-column {
      grid-template-columns: 1fr;
    }

    @media (max-width: 960px) {
      .cv-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Barra Lateral del CV */
    .cv-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .cv-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    /* Hero / Encabezado en Barra Lateral o Superior */
    .hero-profile {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .hero-avatar {
      width: 128px;
      height: 128px;
      border-radius: var(--avatar-radius);
      object-fit: cover;
      border: 4px solid var(--primary);
      box-shadow: var(--shadow-md);
    }

    .hero-name {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-main);
    }

    .hero-headline {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
    }

    .hero-location {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .contact-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
      text-align: left;
      font-size: 0.86rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-main);
      word-break: break-all;
    }

    .contact-item i {
      color: var(--primary);
      flex-shrink: 0;
    }

    .hero-actions {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    /* Acordeones Accesibles (<details>) */
    details.cv-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow var(--transition);
    }

    details.cv-section:hover {
      box-shadow: var(--shadow-md);
    }

    summary.cv-section-header {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.4rem;
      cursor: pointer;
      user-select: none;
      background: var(--bg-card);
      border-bottom: 1px solid transparent;
      transition: background-color var(--transition);
    }

    summary.cv-section-header::-webkit-details-marker {
      display: none;
    }

    details[open] > summary.cv-section-header {
      border-bottom-color: var(--border-color);
      background: var(--bg-muted);
    }

    .section-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-weight: 700;
      font-size: 1.08rem;
      color: var(--text-main);
    }

    .section-icon-box {
      width: 34px;
      height: 34px;
      border-radius: var(--radius);
      background: var(--primary);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .section-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .count-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .chevron-icon {
      transition: transform var(--transition);
      color: var(--text-muted);
    }

    details[open] .chevron-icon {
      transform: rotate(180deg);
    }

    .cv-section-body {
      padding: 1.4rem;
    }

    /* Reproductor de Video 16:9 */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: var(--radius);
      overflow: hidden;
      background: #0f172a;
    }

    .video-container iframe, .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .print-video-fallback {
      display: none;
      padding: 1rem;
      border: 1px dashed var(--border-color);
      border-radius: var(--radius);
      font-size: 0.9rem;
    }

    /* Línea de Tiempo Vertical (Experiencia) */
    .timeline {
      position: relative;
      padding-left: 1.75rem;
      border-left: 2px solid var(--primary);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .timeline-item {
      position: relative;
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.15rem;
      break-inside: avoid;
    }

    .timeline-dot {
      position: absolute;
      left: -2.25rem;
      top: 1.2rem;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg-card);
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
    }

    .exp-company-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .company-logo {
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      object-fit: contain;
      background: #fff;
      padding: 4px;
      border: 1px solid var(--border-color);
    }

    .achievements-list {
      margin-top: 0.6rem;
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.92rem;
    }

    /* Tarjetas de Proyectos (Estándar PMI) */
    .projects-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    .pmi-project-card {
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius);
      padding: 1.25rem;
      break-inside: avoid;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .pmi-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.65rem;
      background: var(--bg-card);
      padding: 0.85rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      font-size: 0.84rem;
    }

    .pmi-meta-item strong {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .pmi-kpi-box {
      background: rgba(217, 119, 6, 0.08);
      border: 1px solid rgba(217, 119, 6, 0.35);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
    }

    /* Certificaciones e Insignias */
    .certs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .cert-card {
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      gap: 0.9rem;
      align-items: flex-start;
      break-inside: avoid;
    }

    .cert-badge-img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      flex-shrink: 0;
      background: #fff;
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    /* Competencias y Talent Triangle del PMI */
    .skill-group {
      margin-bottom: 1.1rem;
    }

    .skill-group-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.55rem;
      font-weight: 700;
    }

    .skill-item {
      margin-bottom: 0.65rem;
    }

    .skill-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.86rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-muted);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
      transition: width 0.8s ease-out;
    }

    .talent-triangle-box {
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem;
      margin-top: 1rem;
    }

    .triangle-bars {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }

    /* Empresas Aliadas / Clientes (Escala de grises a color) */
    .allies-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0;
    }

    .ally-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      padding: 0.75rem 1rem;
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      filter: grayscale(100%);
      opacity: 0.72;
      transition: all var(--transition);
    }

    .ally-item:hover {
      filter: grayscale(0%);
      opacity: 1;
      transform: scale(1.04);
    }

    .ally-logo {
      height: 42px;
      max-width: 120px;
      object-fit: contain;
    }

    /* Sección de Anexos y QR */
    .annexes-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1rem;
      padding: 1.5rem;
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      break-inside: avoid;
    }

    .qr-canvas-wrap {
      background: #ffffff;
      padding: 0.85rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .qr-print-url {
      font-size: 0.78rem;
      color: var(--text-muted);
      word-break: break-all;
      max-width: 360px;
    }

    /* ==========================================================================
