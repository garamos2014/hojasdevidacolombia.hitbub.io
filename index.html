<!DOCTYPE html>
<html lang="es" data-theme="corporate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hojas de Vida | PMI CV Platform</title>
  
  <meta property="og:title" content="Plataforma de Hojas de Vida (Estándar PMI)" />
  <meta property="og:description" content="Portafolio ejecutivo de dirección de proyectos, KPIs, certificaciones y competencias bajo estándares PMI." />
  <meta property="og:type" content="website" />

  <!-- Google Fonts (5 opciones seleccionables desde Apariencia) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:wght@300;400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Librerías por CDN: Lucide Icons y QRCode -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <style>
    /* ==========================================================================
       1. VARIABLES CSS Y SISTEMA DE DISEÑO (:root)
       ========================================================================== */
    :root {
      --primary: #0f4c81;       /* Azul corporativo PMI */
      --secondary: #1e293b;     /* Slate oscuro */
      --accent: #d97706;        /* Ámbar ejecutivo para logros/KPIs */
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-muted: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #e2e8f0;
      --radius: 12px;           /* Configurable: 12px (Redondeado) o 2px (Cuadrado) */
      --avatar-radius: 50%;     /* 50% (Circular) o 6px (Cuadrado) */
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Tema Oscuro */
    [data-theme="dark"] {
      --bg-body: #0b1120;
      --bg-card: #1e293b;
      --bg-muted: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.4);
    }

    /* Tema Corporativo (Alto contraste limpio) */
    [data-theme="corporate"] {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-muted: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #334155;
      --border-color: #cbd5e1;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       2. RESET Y ESTILOS BASE
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-family: var(--font-main);
      color: var(--text-main);
      background-color: var(--bg-body);
      line-height: 1.6;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color var(--transition), color var(--transition);
    }

    a {
      color: var(--primary);
      text-decoration: none;
      transition: opacity var(--transition);
    }

    a:hover {
      opacity: 0.85;
      text-decoration: underline;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 0.95rem;
      color: inherit;
    }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* ==========================================================================
       3. BARRA SUPERIOR DE NAVEGACIÓN GLOBAL
       ========================================================================== */
    .top-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary);
      text-decoration: none !important;
    }

    .brand-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--primary);
      color: #fff;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .mode-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
    }

    .mode-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    .mode-dot.local {
      background: var(--accent);
    }

    /* ==========================================================================
       4. BOTONES Y COMPONENTES COMUNES
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.88rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none !important;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .btn-secondary {
      background: var(--bg-muted);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--border-color);
    }

    .btn-accent {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-danger {
      background: #ef4444;
      color: #ffffff;
    }

    .btn-sm {
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg-muted);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .badge-agile { background: #dcfce7; color: #166534; border-color: #86efac; }
    .badge-predictive { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
    .badge-hybrid { background: #fef3c7; color: #92400e; border-color: #fde68a; }

    /* ==========================================================================
       5. CONTENEDOR PRINCIPAL Y PANEL (#/)
       ========================================================================== */
    .main-container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem;
      flex: 1;
    }

    .directory-hero {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: var(--radius);
      margin-bottom: 2rem;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .directory-hero h1 {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      margin-bottom: 0.5rem;
    }

    .directory-hero p {
      opacity: 0.9;
      max-width: 680px;
      margin: 0 auto 1.5rem;
    }

    .search-bar {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
      background: #ffffff;
      padding: 0.4rem;
      border-radius: var(--radius);
    }

    .search-bar input {
      flex: 1;
      border: none;
      padding: 0.6rem 0.8rem;
      color: #0f172a;
      background: transparent;
      outline: none;
    }

    .directory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .profile-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .profile-card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .profile-card-avatar {
      width: 68px;
      height: 68px;
      border-radius: var(--avatar-radius);
      object-fit: cover;
      border: 2px solid var(--primary);
      flex-shrink: 0;
    }

    /* ==========================================================================
       6. HOJA DE VIDA (#/cv/{slug})
       ========================================================================== */
    /* Barra de navegación rápida de secciones (Scroll Spy) */
    .cv-subnav {
      position: sticky;
      top: 57px;
      z-index: 90;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.5rem 0.8rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    .section-anchors {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .section-anchor {
      padding: 0.35rem 0.7rem;
      border-radius: var(--radius);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      text-decoration: none !important;
      transition: all var(--transition);
    }

    .section-anchor:hover, .section-anchor.active {
      background: var(--primary);
      color: #ffffff;
    }

    .accordion-controls {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    /* Layout del CV: Barra lateral + Contenido principal o 1 sola columna */
    .cv-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.75rem;
      align-items: start;
    }

    .cv-layout.single-column {
      grid-template-columns: 1fr;
    }

    @media (max-width: 960px) {
      .cv-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Barra Lateral del CV */
    .cv-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .cv-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    /* Hero / Encabezado en Barra Lateral o Superior */
    .hero-profile {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .hero-avatar {
      width: 128px;
      height: 128px;
      border-radius: var(--avatar-radius);
      object-fit: cover;
      border: 4px solid var(--primary);
      box-shadow: var(--shadow-md);
    }

    .hero-name {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-main);
    }

    .hero-headline {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
    }

    .hero-location {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .contact-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
      text-align: left;
      font-size: 0.86rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-main);
      word-break: break-all;
    }

    .contact-item i {
      color: var(--primary);
      flex-shrink: 0;
    }

    .hero-actions {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    /* Acordeones Accesibles (<details>) */
    details.cv-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow var(--transition);
    }

    details.cv-section:hover {
      box-shadow: var(--shadow-md);
    }

    summary.cv-section-header {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.4rem;
      cursor: pointer;
      user-select: none;
      background: var(--bg-card);
      border-bottom: 1px solid transparent;
      transition: background-color var(--transition);
    }

    summary.cv-section-header::-webkit-details-marker {
      display: none;
    }

    details[open] > summary.cv-section-header {
      border-bottom-color: var(--border-color);
      background: var(--bg-muted);
    }

    .section-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-weight: 700;
      font-size: 1.08rem;
      color: var(--text-main);
    }

    .section-icon-box {
      width: 34px;
      height: 34px;
      border-radius: var(--radius);
      background: var(--primary);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .section-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .count-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .chevron-icon {
      transition: transform var(--transition);
      color: var(--text-muted);
    }

    details[open] .chevron-icon {
      transform: rotate(180deg);
    }

    .cv-section-body {
      padding: 1.4rem;
    }

    /* Reproductor de Video 16:9 */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: var(--radius);
      overflow: hidden;
      background: #0f172a;
    }

    .video-container iframe, .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .print-video-fallback {
      display: none;
      padding: 1rem;
      border: 1px dashed var(--border-color);
      border-radius: var(--radius);
      font-size: 0.9rem;
    }

    /* Línea de Tiempo Vertical (Experiencia) */
    .timeline {
      position: relative;
      padding-left: 1.75rem;
      border-left: 2px solid var(--primary);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .timeline-item {
      position: relative;
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.15rem;
      break-inside: avoid;
    }

    .timeline-dot {
      position: absolute;
      left: -2.25rem;
      top: 1.2rem;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg-card);
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
    }

    .exp-company-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .company-logo {
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      object-fit: contain;
      background: #fff;
      padding: 4px;
      border: 1px solid var(--border-color);
    }

    .achievements-list {
      margin-top: 0.6rem;
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.92rem;
    }

    /* Tarjetas de Proyectos (Estándar PMI) */
    .projects-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    .pmi-project-card {
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius);
      padding: 1.25rem;
      break-inside: avoid;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .pmi-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.65rem;
      background: var(--bg-card);
      padding: 0.85rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      font-size: 0.84rem;
    }

    .pmi-meta-item strong {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .pmi-kpi-box {
      background: rgba(217, 119, 6, 0.08);
      border: 1px solid rgba(217, 119, 6, 0.35);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
    }

    /* Certificaciones e Insignias */
    .certs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .cert-card {
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      gap: 0.9rem;
      align-items: flex-start;
      break-inside: avoid;
    }

    .cert-badge-img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      flex-shrink: 0;
      background: #fff;
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    /* Competencias y Talent Triangle del PMI */
    .skill-group {
      margin-bottom: 1.1rem;
    }

    .skill-group-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.55rem;
      font-weight: 700;
    }

    .skill-item {
      margin-bottom: 0.65rem;
    }

    .skill-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.86rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-muted);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
      transition: width 0.8s ease-out;
    }

    .talent-triangle-box {
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem;
      margin-top: 1rem;
    }

    .triangle-bars {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }

    /* Empresas Aliadas / Clientes (Escala de grises a color) */
    .allies-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0;
    }

    .ally-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      padding: 0.75rem 1rem;
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      filter: grayscale(100%);
      opacity: 0.72;
      transition: all var(--transition);
    }

    .ally-item:hover {
      filter: grayscale(0%);
      opacity: 1;
      transform: scale(1.04);
    }

    .ally-logo {
      height: 42px;
      max-width: 120px;
      object-fit: contain;
    }

    /* Sección de Anexos y QR */
    .annexes-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1rem;
      padding: 1.5rem;
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      break-inside: avoid;
    }

    .qr-canvas-wrap {
      background: #ffffff;
      padding: 0.85rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .qr-print-url {
      font-size: 0.78rem;
      color: var(--text-muted);
      word-break: break-all;
      max-width: 360px;
    }

    /* ==========================================================================
       7. EDITOR CON VISTA PREVIA
       ========================================================================== */
    .editor-shell {
      display: grid;
      grid-template-columns: 240px 1fr 400px;
      gap: 1.25rem;
      align-items: start;
    }

    @media (max-width: 1200px) {
      .editor-shell {
        grid-template-columns: 220px 1fr;
      }
      .editor-live-preview {

       La hoja de vida va dentro de una tabla (.print-frame) cuyo encabezado y pie

       margen 0, que es lo que evita que el navegador imprima su propio encabezado
       y pie (fecha, título, nombre/ruta del archivo y número de página).
       ========================================================================== */
    .print-only-header { display: none; }

    .print-frame {
      width: 100%;
      border-collapse: collapse;
    }

    .print-frame td { padding: 0; }

    @media screen {

      .print-frame > tbody > tr > td { display: block; }

      .print-frame > tfoot { display: none; }
    }

    @media print {

        size: A4 portrait;
        margin: 0;
      }

      html[data-theme] {
        --bg-body: #ffffff;
        --bg-card: #ffffff;
        --bg-muted: #f8fafc;
        --text-main: #0f172a;
        --text-muted: #475569;
        --border-color: #cbd5e1;
        font-size: 10pt;
        -webkit-print-color-adjust: exact;

      }

      .cv-subnav,
      .hero-actions,
      .no-print,
      .video-container,
      .toast-container,
      .modal-backdrop,
      .chevron-icon {
        display: none !important;
      }

      .print-video-fallback { display: block; }

      .print-frame { table-layout: fixed; }
      .print-frame > tbody > tr > td { padding: 0 14mm; }
      .print-space { height: 12mm; }

      .print-only-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        border-bottom: 2px solid var(--primary);
        padding-bottom: 6px;
        margin-bottom: 12px;
        font-size: 8.5pt;
        color: #334155;

      .main-container {

        padding: 0;
        margin: 0;
      }

      .cv-layout {
        grid-template-columns: 230px 1fr;
        gap: 14px;

      .cv-card, details.cv-section, .timeline-item, .pmi-project-card, .cert-card, .annexes-box {

      .hero-profile, .timeline-item, .pmi-project-card, .cert-card, .annexes-box, .skill-item, .talent-triangle-box {

      }

      summary.cv-section-header { break-after: avoid; }

      .ally-item {
        filter: none;
        opacity: 1;
      }

    function normalizeCV(raw) {

    /* ==========================================================================
       3. UTILIDADES
       ========================================================================== */
    const $ = (id) => document.getElementById(id);
    const refreshIcons = () => window.lucide?.createIcons();
    const visible = (list) => (list || []).filter(item => item.is_visible !== false);
    const percent = (n) => Math.min(100, Math.max(0, Number(n) || 0));
    const toArray = (v, sep = '\n') =>
      (Array.isArray(v) ? v : String(v || '').split(sep)).map(s => String(s).trim()).filter(Boolean);

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* Enlaces externos: solo https:// */
    function safeURL(url) {
      const v = String(url || '').trim();
      return /^https:\/\//i.test(v) ? v : '';
    }

    /* Imágenes elegidas con "Elegir archivo" en esta sesión: permiten verlas en la
       vista previa aunque todavía no se hayan copiado a la carpeta de index.html */
    const sessionImages = new Map();

    const isWebURL = (path) => /^https:\/\//i.test(String(path || '').trim());

    /* Imágenes y videos: enlace https:// o archivo ubicado en la carpeta de index.html */
    function mediaSrc(path) {
      const v = String(path || '').trim();
      if (!v) return '';
      if (sessionImages.has(v)) return sessionImages.get(v);
      if (isWebURL(v)) return v;
      if (/^[a-z][a-z0-9+.-]*:/i.test(v) || v.startsWith('//') || v.startsWith('\\')) return '';
      return v;
    }

    /* Ícono: nombre de Lucide (ej. "briefcase") o archivo de imagen / enlace https:// */
    function iconHTML(value, size = 16, style = '') {
      const v = String(value || '').trim();
      if (isWebURL(v) || /\.(png|jpe?g|gif|webp|svg)$/i.test(v)) {
        const src = mediaSrc(v);
        return src ? `<img src="${escapeHTML(src)}" alt="" class="icon-img" style="width:${size}px;height:${size}px;${style}" />` : '';
      }
      return `<i data-lucide="${escapeHTML(v || 'circle')}" style="width:${size}px;height:${size}px;${style}"></i>`;
    }

    function avatarHTML(profile, cssClass) {
      const src = mediaSrc(profile.avatar_url);
      if (src) return `<img src="${escapeHTML(src)}" alt="Foto de ${escapeHTML(profile.full_name)}" class="${cssClass}" />`;
      const initials = String(profile.full_name || '?').split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
      return `<div class="${cssClass} avatar-fallback" aria-hidden="true">${escapeHTML(initials)}</div>`;
    }

    function slugify(text) {
      return String(text || '')
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 60);
    }

    function todayText() {
      return new Date().toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function showToast(message) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = message;
      $('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 4500);
    }

    /* ---------- Modal único ---------- */
    let modalOnClose = null;

    function openModal(title, bodyHTML, onClose = null) {
      closeModal();
      $('modal-title').textContent = title;
      $('modal-body').innerHTML = bodyHTML;
      modalOnClose = onClose;
      $('modal').classList.add('open');
      refreshIcons();
      return $('modal-body');
    }

    function closeModal() {
      $('modal').classList.remove('open');
      const callback = modalOnClose;
      modalOnClose = null;
      if (callback) callback();
    }

    function confirmModal(title, text, okLabel, danger = false) {
      return new Promise(resolve => {
        let answer = false;
        const body = openModal(title, `
          <p>${escapeHTML(text)}</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-answer="no">Cancelar</button>
            <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-answer="yes">${escapeHTML(okLabel)}</button>
          </div>
        `, () => resolve(answer));
        body.querySelectorAll('[data-answer]').forEach(btn => btn.addEventListener('click', () => {
          answer = btn.dataset.answer === 'yes';
          closeModal();
        }));
      });
    }

    $('modal-close').addEventListener('click', closeModal);
    $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    /* ==========================================================================
       4. ALMACENAMIENTO (Supabase, o este navegador si no hay conexión)
       ========================================================================== */
    const withTimeout = (promise, ms = 8000) => Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('Tiempo de espera agotado')), ms))
    ]);

    const store = {
      mode: 'local',
      client: null,
      ready: null,

      init() {
        this.ready ??= (async () => {
          try {
            const { createClient } = await withTimeout(import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'));
            const client = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
            const { error } = await withTimeout(client.from(TABLE).select('slug').limit(1));
            if (error) throw new Error(error.message);
            this.client = client;
            this.mode = 'supabase';
          } catch (err) {
            console.warn(`No se pudo usar la tabla "${TABLE}" de Supabase; se guarda en este navegador.`, err);
          }
          const online = this.mode === 'supabase';
          $('mode-dot').className = online ? 'mode-dot' : 'mode-dot local';
          $('mode-label').textContent = online ? 'Base de datos conectada' : 'Guardado local (este navegador)';
        })();
        return this.ready;
      },

      localRows() {
        try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch { return []; }
      },

      async list() {
        await this.init();
        if (this.mode === 'local') {
          return this.localRows()
            .sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)))
            .map(row => normalizeCV(row.data));
        }
        const { data, error } = await this.client.from(TABLE).select('data').order('updated_at', { ascending: false });
        if (error) throw new Error(error.message);
        return data.map(row => normalizeCV(row.data));
      },

      async get(slug) {
        await this.init();
        if (this.mode === 'local') {
          const row = this.localRows().find(r => r.slug === slug);
          return row ? normalizeCV(row.data) : null;
        }
        const { data, error } = await this.client.from(TABLE).select('data').eq('slug', slug).maybeSingle();
        if (error) throw new Error(error.message);
        return data ? normalizeCV(data.data) : null;
      },

      /* previousSlug: enlace con el que estaba guardada (null si es nueva) */
      async save(cv, previousSlug) {
        const slug = cv.profile.slug;
        if (slug !== previousSlug && await this.get(slug)) {
          throw new Error(`Ya existe una hoja de vida con el enlace "${slug}". Cámbialo en Datos personales.`);
        }
        const row = { slug, data: cv, updated_at: new Date().toISOString() };
        if (this.mode === 'local') {
          const rows = this.localRows().filter(r => r.slug !== slug && r.slug !== previousSlug);
          localStorage.setItem(LOCAL_KEY, JSON.stringify([...rows, row]));
          return;
        }
        const { error } = await this.client.from(TABLE).upsert(row);
        if (error) throw new Error(error.message);
        if (previousSlug && previousSlug !== slug) await this.remove(previousSlug);
      },

      async remove(slug) {
        await this.init();
        if (this.mode === 'local') {
          localStorage.setItem(LOCAL_KEY, JSON.stringify(this.localRows().filter(r => r.slug !== slug)));
          return;
        }
        const { error } = await this.client.from(TABLE).delete().eq('slug', slug);
        if (error) throw new Error(error.message);
      }
    };

    /* Lista todas las imágenes, íconos y videos que usa la hoja de vida */

    function toCommentedJSON(cv) {
      const lines = [];
      const comment = (text = '', indent = 0) => lines.push(`${' '.repeat(indent)}//${text ? ' ' + text : ''}`);
      const bar = '=====================================================================';
      const { local } = listMediaFiles(cv);

      comment(bar);
      comment(` HOJA DE VIDA: ${cv.profile.full_name || '(sin nombre)'}`);
      comment(` Archivo de datos exportado el ${todayText()} desde PMI CV Platform`);
      comment(bar);
      comment();
      comment(' ¿QUÉ ES ESTE ARCHIVO?');

      comment(' con // son comentarios de ayuda: el programa las ignora al importar.');
      comment();
      comment(' ¿CÓMO AGREGARLO A LA BASE DE DATOS?');
      comment(' 1. Abre index.html y pulsa "Agregar nueva" (o "Editar" en una hoja de vida existente).');
      comment(' 2. Pulsa "Importar JSON" y elige este archivo.');
      comment(' 3. Revisa la vista previa y pulsa "Guardar".');
      comment();
      comment(' IMÁGENES E ÍCONOS (MUY IMPORTANTE)');
      comment(' Este archivo NO lleva las imágenes por dentro: solo guarda su dirección');
      comment(' (el nombre del archivo). Para que se vean, copia cada imagen en la MISMA');
      comment(' CARPETA donde está index.html, con el nombre exacto que aparece aquí');
      comment(' (respeta mayúsculas, minúsculas y la extensión .jpg / .png).');
      comment();
      if (local.length) {
        comment(' Archivos que esta hoja de vida necesita en la carpeta de index.html:');
        local.forEach(ref => comment(`   - ${ref.path}   (${ref.label})`));
      } else {
        comment(' Esta hoja de vida no usa archivos de imagen locales por ahora.');
      }
      comment(' Las direcciones que empiezan por https:// son imágenes de internet: no hay que copiarlas.');
      comment();
      comment(' REGLAS PARA EDITARLO A MANO (por ejemplo con el Bloc de notas)');
      comment(' - Cambia solo el texto que está entre comillas, a la derecha de los dos puntos.');
      comment(' - No borres comillas, comas, llaves { } ni corchetes [ ].');
      comment(' - true = sí, false = no (se escriben sin comillas).');
      comment(bar);
      lines.push('{');

      const keys = Object.keys(JSON_HELP);
      keys.forEach((key, index) => {
        const help = JSON_HELP[key];
        const comma = index < keys.length - 1 ? ',' : '';
        lines.push('');
        comment(`---------- ${help.title} ----------`, 2);
        (help.notes || []).forEach(note => comment(note, 2));

        if (Array.isArray(cv[key])) {
          const body = JSON.stringify(cv[key], null, 2).split('\n').map((l, i) => (i ? '  ' + l : l)).join('\n');
          lines.push(`  "${key}": ${body}${comma}`);
        } else {
          lines.push(`  "${key}": {`);
          const entries = Object.entries(cv[key]);
          entries.forEach(([field, value], i) => {
            if (help.fields?.[field]) comment(help.fields[field], 4);
            lines.push(`    ${JSON.stringify(field)}: ${JSON.stringify(value)}${i < entries.length - 1 ? ',' : ''}`);
          });
          lines.push(`  }${comma}`);
        }
      });

      lines.push('}');
      return lines.join('\n').replace(/\n/g, '\r\n');
    }

    /* Lee un JSON con o sin comentarios (de línea o de bloque) y tolera comas sobrantes */
    function parseCommentedJSON(text) {
      const source = String(text).replace(/^﻿/, '');
      let clean = '';
      let inString = false;

      for (let i = 0; i < source.length; i++) {
        const ch = source[i];
        const next = source[i + 1];
        if (inString) {
          clean += ch;
          if (ch === '\\') clean += source[++i] ?? '';
          else if (ch === '"') inString = false;
        } else if (ch === '"') {
          inString = true;
          clean += ch;
        } else if (ch === '/' && next === '/') {
          while (i < source.length && source[i] !== '\n') i++;
          clean += '\n';
        } else if (ch === '/' && next === '*') {
          i += 2;
          while (i < source.length && !(source[i] === '*' && source[i + 1] === '/')) i++;
          i++;
        } else {
          clean += ch;
        }
      }

      let result = '';
      inString = false;
      for (let i = 0; i < clean.length; i++) {
        const ch = clean[i];
        if (inString) {
          result += ch;
          if (ch === '\\') result += clean[++i] ?? '';
          else if (ch === '"') inString = false;
        } else if (ch === '"') {
          inString = true;
          result += ch;
        } else if (ch === ',' && /^\s*[}\]]/.test(clean.slice(i + 1))) {
          continue;
        } else {
          result += ch;
        }
      }
      return JSON.parse(result);
    }

      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function applyVisualSettings(settings = DEFAULT_SETTINGS) {
      const s = { ...DEFAULT_SETTINGS, ...settings };
      const root = document.documentElement;
      const font = FONTS.includes(s.font_family) ? s.font_family : 'Inter';
      root.setAttribute('data-theme', s.theme);
      root.style.setProperty('--primary', s.primary_color);
      root.style.setProperty('--secondary', s.secondary_color);
      root.style.setProperty('--accent', s.accent_color);
      root.style.setProperty('--radius', s.border_style === 'square' ? '2px' : '12px');
      root.style.setProperty('--avatar-radius', s.border_style === 'square' ? '6px' : '50%');
      root.style.setProperty('--font-main', `'${font}', sans-serif`);
    }

          <div class="search-bar" role="search">
            <input type="search" id="dir-search" placeholder="Buscar por nombre, cargo o habilidad (ej. PMP, Scrum, SAP)…" aria-label="Buscar hojas de vida" />
          </div>
        </section>

        ${store.mode === 'local' ? `
          <div class="notice">
            <strong>Guardado local:</strong> no se encontró la tabla <code>${TABLE}</code> en la base de datos, así que las hojas de vida
            se guardan solo en este navegador. Ejecuta una vez el archivo <code>supabase-tabla.sql</code> en Supabase para que sean visibles desde cualquier equipo.

      const renderCards = (query = '') => {
        const q = query.trim().toLowerCase();
        const grid = $('dir-results');
        const filtered = items.filter(cv => !q || [cv.profile.full_name, cv.profile.headline, ...visible(cv.skills).map(s => s.name)]
          .some(text => String(text || '').toLowerCase().includes(q)));

        $('dir-count').textContent = `${filtered.length} ${filtered.length === 1 ? 'hoja de vida' : 'hojas de vida'}`;

        if (!items.length) {
          grid.innerHTML = `
            <div class="cv-card empty-state">
              <h2 style="font-size:1.15rem; margin-bottom:0.4rem;">Todavía no hay hojas de vida</h2>
              <p style="color:var(--text-muted); margin-bottom:1rem;">Pulsa «Agregar nueva» para crear la primera, o carga una de ejemplo para ver cómo queda.</p>
              <button type="button" class="btn btn-secondary" id="load-example"><i data-lucide="sparkles"></i> Cargar hoja de vida de ejemplo</button>
            </div>`;
          $('load-example').addEventListener('click', async () => {
            try {
              await store.save(structuredClone(EXAMPLE_CV), null);
              router();
            } catch (err) {
              showToast(`No se pudo guardar el ejemplo: ${err.message}`);
            }
          });
        } else if (!filtered.length) {
          grid.innerHTML = `<div class="cv-card empty-state">No se encontraron hojas de vida con ese criterio.</div>`;
        } else {
          grid.innerHTML = filtered.map(cv => {
            const p = cv.profile;
            const slug = encodeURIComponent(p.slug);
            return `
              <article class="profile-card">
                <div class="profile-card-header">
                  ${avatarHTML(p, 'profile-card-avatar')}
                  <div>
                    <h2 style="font-size:1.08rem; margin-bottom:0.2rem;">${escapeHTML(p.full_name)}</h2>
                    <p style="font-size:0.84rem; color:var(--primary); font-weight:600;">${escapeHTML(p.headline)}</p>
                    ${p.location ? `<span style="font-size:0.78rem; color:var(--text-muted);"><i data-lucide="map-pin" style="width:13px;height:13px;vertical-align:middle;"></i> ${escapeHTML(p.location)}</span>` : ''}
                  </div>
                </div>
                <p style="font-size:0.86rem; color:var(--text-muted); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">${escapeHTML(p.summary)}</p>
                <div style="display:flex; flex-wrap:wrap; gap:0.35rem;">

                <div style="margin-top:auto; padding-top:0.75rem; border-top:1px solid var(--border-color); display:flex; justify-content:flex-end; gap:0.5rem;">
                  <a href="#/editar/${slug}" class="btn btn-secondary btn-sm"><i data-lucide="pencil"></i> Editar</a>
                  <a href="#/cv/${slug}" class="btn btn-primary btn-sm">Ver hoja de vida <i data-lucide="arrow-right"></i></a>
                </div>
              </article>`;
          }).join('');
        }
        refreshIcons();
      };

      renderCards();
      $('dir-search').addEventListener('input', (e) => renderCards(e.target.value));
    }

    /* ==========================================================================
       8. VISTA: HOJA DE VIDA (#/cv/{slug})
       ========================================================================== */
    function methodologyBadgeClass(methodology = '') {
      const m = String(methodology).toLowerCase();
      if (m.includes('ágil') || m.includes('agil') || m.includes('agile')) return 'badge-agile';
      if (m.includes('predict')) return 'badge-predictive';
      return 'badge-hybrid';
    }

    /* Acepta enlaces normales de YouTube/Vimeo y los convierte al formato incrustable */
    function videoEmbed(url) {
      const v = String(url || '').trim();
      if (!v) return null;
      const youtube = v.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
      if (youtube) return { tag: 'iframe', src: `https://www.youtube.com/embed/${youtube[1]}`, link: v };
      const vimeo = v.match(/vimeo\.com\/(?:video\/)?(\d+)/);
      if (vimeo) return { tag: 'iframe', src: `https://player.vimeo.com/video/${vimeo[1]}`, link: v };
      if (/\.(mp4|webm)$/i.test(v)) {
        const src = mediaSrc(v);
        return src ? { tag: 'video', src, link: v } : null;
      }
      const src = safeURL(v);
      return src ? { tag: 'iframe', src, link: v } : null;
    }

    function generateQRCodes(container) {
      if (!window.QRCode) return;
      container.querySelectorAll('.cv-qr-canvas').forEach(canvas => {
        window.QRCode.toCanvas(canvas, canvas.dataset.url, {
          width: 148,
          margin: 1,
          color: { dark: '#0f172a', light: '#ffffff' }
        }, (err) => { if (err) console.warn('Error generando QR:', err); });
      });
    }

    function renderSectionContent(key, cv) {
      const { profile, settings } = cv;

      switch (key) {
        case 'video': {
          const video = videoEmbed(profile.video_url);
          if (!video) return '';
          return `
            <div class="video-container">
              ${video.tag === 'video'
                ? `<video controls preload="none" src="${escapeHTML(video.src)}"></video>`
                : `<iframe src="${escapeHTML(video.src)}" title="Video de presentación de ${escapeHTML(profile.full_name)}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`}
            </div>
            <div class="print-video-fallback">
              <strong>Video de presentación disponible en línea:</strong><br/>
              <span>${escapeHTML(video.link)}</span>
            </div>`;
        }

        case 'summary':
          return profile.summary
            ? `<p style="font-size:0.98rem; line-height:1.75; white-space:pre-line;">${escapeHTML(profile.summary)}</p>`
            : '';

        case 'experience': {
          const list = visible(cv.experiences);
          if (!list.length) return '';
          return `
            <div class="timeline">
              ${list.map(exp => `
                <article class="timeline-item">
                  <span class="timeline-dot" aria-hidden="true"></span>
                  <div class="exp-header">
                    <div class="exp-company-wrap">
                      ${mediaSrc(exp.company_logo) ? `<img src="${escapeHTML(mediaSrc(exp.company_logo))}" alt="Logo ${escapeHTML(exp.company)}" class="company-logo" loading="lazy" />` : ''}
                      <div>
                        <h3 style="font-size:1.02rem; font-weight:700;">${escapeHTML(exp.role)}</h3>
                        <p style="font-size:0.88rem; color:var(--primary); font-weight:600;">${escapeHTML(exp.company)}</p>
                      </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:0.45rem; flex-wrap:wrap;">
                      ${exp.methodology ? `<span class="badge ${methodologyBadgeClass(exp.methodology)}">${escapeHTML(exp.methodology)}</span>` : ''}
                      <span class="badge"><i data-lucide="calendar" style="width:12px;height:12px;"></i> ${escapeHTML(exp.start_date)} — ${escapeHTML(exp.is_current ? 'Actualidad' : exp.end_date)}</span>
                    </div>
                  </div>
                  <ul class="achievements-list">
                    ${toArray(exp.achievements).map(item => `<li>${escapeHTML(item)}</li>`).join('')}
                  </ul>
                </article>
              `).join('')}
            </div>`;
        }

        case 'projects': {
          const list = visible(cv.projects);
          if (!list.length) return '';
          return `
            <div class="projects-grid">
              ${list.map(proj => `
                <article class="pmi-project-card">
                  <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.75rem; flex-wrap:wrap;">
                    <div class="exp-company-wrap">
                      ${mediaSrc(proj.client_logo) ? `<img src="${escapeHTML(mediaSrc(proj.client_logo))}" alt="Logo ${escapeHTML(proj.client_name)}" class="company-logo" loading="lazy" />` : ''}
                      <div>
                        <h3 style="font-size:1.06rem; font-weight:700; color:var(--primary);">${escapeHTML(proj.name)}</h3>
                        <p style="font-size:0.85rem; color:var(--text-muted);"><strong>Cliente / Patrocinador:</strong> ${escapeHTML(proj.client_name)} | <strong>Rol:</strong> ${escapeHTML(proj.role)}</p>
                      </div>
                    </div>
                    ${proj.methodology ? `<span class="badge ${methodologyBadgeClass(proj.methodology)}">Metodología ${escapeHTML(proj.methodology)}</span>` : ''}
                  </div>

                  ${proj.scope ? `<p style="font-size:0.9rem;"><strong>Alcance del proyecto:</strong> ${escapeHTML(proj.scope)}</p>` : ''}

                  <div class="pmi-meta-grid">
                    <div class="pmi-meta-item">
                      <strong>Presupuesto gestionado</strong>
                      <span>${escapeHTML(proj.currency || 'USD')} $${(Number(proj.budget) || 0).toLocaleString('es-CO')}</span>
                    </div>
                    <div class="pmi-meta-item">
                      <strong>Tamaño del equipo</strong>
                      <span>${Number(proj.team_size) || 0} especialistas</span>
                    </div>
                    <div class="pmi-meta-item">
                      <strong>Duración / Cronograma</strong>
                      <span>${escapeHTML(proj.duration)}</span>
                    </div>
                  </div>

                  ${proj.deliverables ? `<p style="font-size:0.88rem;"><strong>Entregables clave (WBS):</strong> ${escapeHTML(proj.deliverables)}</p>` : ''}

                  ${proj.kpis_results ? `
                    <div class="pmi-kpi-box">
                      <strong style="color:var(--accent); display:flex; align-items:center; gap:0.35rem; margin-bottom:0.2rem;">
                        <i data-lucide="bar-chart-3" style="width:16px;height:16px;"></i> KPIs y resultados medibles:
                      </strong>
                      <span>${escapeHTML(proj.kpis_results)}</span>
                    </div>` : ''}

                  ${toArray(proj.knowledge_areas, ',').length ? `
                    <div style="display:flex; flex-wrap:wrap; gap:0.35rem; align-items:center;">
                      <span style="font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-right:0.25rem;">Áreas PMBOK®:</span>
                      ${toArray(proj.knowledge_areas, ',').map(area => `<span class="badge">${escapeHTML(area)}</span>`).join('')}
                    </div>` : ''}
                </article>
              `).join('')}
            </div>`;
        }

        case 'certifications': {
          const list = visible(cv.certifications);
          if (!list.length) return '';
          return `
            <div class="certs-grid">
              ${list.map(cert => `
                <article class="cert-card">
                  ${(settings.show_badges && mediaSrc(cert.badge_url)) ? `<img src="${escapeHTML(mediaSrc(cert.badge_url))}" alt="Insignia ${escapeHTML(cert.name)}" class="cert-badge-img" loading="lazy" />` : ''}
                  <div style="flex:1;">
                    <h3 style="font-size:0.95rem; font-weight:700;">${escapeHTML(cert.name)}</h3>
                    <p style="font-size:0.82rem; color:var(--primary); font-weight:600;">${escapeHTML(cert.issuer)}</p>
                    <p style="font-size:0.78rem; color:var(--text-muted); margin-top:0.25rem;">
                      ${[
                        cert.credential_code && `ID: <strong>${escapeHTML(cert.credential_code)}</strong>`,
                        cert.issue_date && `Emisión: ${escapeHTML(cert.issue_date)}`,
                        cert.expiry_date && `Vence: ${escapeHTML(cert.expiry_date)}`
                      ].filter(Boolean).join(' | ')}
                    </p>
                    <div style="display:flex; flex-wrap:wrap; gap:0.35rem; margin-top:0.45rem;">
                      ${Number(cert.pdus) ? `<span class="badge">${Number(cert.pdus)} PDUs</span>` : ''}
                      ${cert.talent_triangle ? `<span class="badge">${escapeHTML(cert.talent_triangle)}</span>` : ''}
                    </div>
                    ${safeURL(cert.verify_url) ? `<a href="${escapeHTML(safeURL(cert.verify_url))}" target="_blank" rel="noopener noreferrer" style="display:inline-flex; align-items:center; gap:0.25rem; font-size:0.78rem; margin-top:0.45rem; font-weight:600;">Verificar credencial <i data-lucide="external-link" style="width:12px;height:12px;"></i></a>` : ''}
                  </div>
                </article>
              `).join('')}
            </div>`;
        }

        case 'education': {
          const list = visible(cv.education);
          if (!list.length) return '';
          return `
            <div style="display:grid; gap:0.85rem;">
              ${list.map(ed => `
                <div style="padding:1rem; background:var(--bg-muted); border:1px solid var(--border-color); border-radius:var(--radius); display:flex; justify-content:space-between; flex-wrap:wrap; gap:0.5rem; break-inside:avoid;">
                  <div>
                    <h3 style="font-size:0.98rem; font-weight:700;">${escapeHTML(ed.degree)}</h3>
                    <p style="font-size:0.86rem; color:var(--primary); font-weight:600;">${escapeHTML([ed.institution, ed.field].filter(Boolean).join(' — '))}</p>
                  </div>
                  <span class="badge">${escapeHTML([ed.start_year, ed.end_year].filter(Boolean).join(' - '))}</span>
                </div>
              `).join('')}
            </div>`;
        }

        case 'allies': {
          const list = visible(cv.allies);
          if (!list.length) return '';
          return `
            <div class="allies-strip">
              ${list.map(ally => {
                const href = safeURL(ally.website_url);
                const inner = `
                  ${mediaSrc(ally.logo_url) ? `<img src="${escapeHTML(mediaSrc(ally.logo_url))}" alt="" class="ally-logo" loading="lazy" />` : ''}
                  <span style="font-size:0.76rem; font-weight:600; color:var(--text-main);">${escapeHTML(ally.name)}</span>`;
                return href
                  ? `<a href="${escapeHTML(href)}" target="_blank" rel="noopener noreferrer" class="ally-item">${inner}</a>`
                  : `<div class="ally-item">${inner}</div>`;
              }).join('')}
            </div>`;
        }

        case 'annexes': {
          const driveURL = safeURL(profile.drive_url);
          if (!driveURL) return '';
          return `
            <div class="annexes-box">
              <p style="font-size:0.9rem; max-width:520px; color:var(--text-muted);">
                Escanea el código QR o usa el botón para consultar certificados, diplomas, actas de proyecto y demás respaldos:
              </p>
              ${settings.show_qr ? `
                <div class="qr-canvas-wrap">
                  <canvas class="cv-qr-canvas" data-url="${escapeHTML(driveURL)}" aria-label="Código QR hacia la carpeta de anexos"></canvas>
                  <span class="qr-print-url">${escapeHTML(driveURL)}</span>
                </div>` : ''}
              <a href="${escapeHTML(driveURL)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary no-print">
                <i data-lucide="folder-open"></i> Ver anexos
              </a>
            </div>`;

        default:
          return '';
      }
    }

    function renderCVHTML(cv, isPreview = false) {
      const { profile, settings } = cv;
      applyVisualSettings(settings);

      const sections = visible(cv.sections)
        .map(sec => ({ ...sec, html: renderSectionContent(sec.section_key, cv) }))
        .filter(sec => sec.html);

      const countable = { experience: 'experiences', projects: 'projects', certifications: 'certifications', education: 'education', allies: 'allies' };

      const skills = visible(cv.skills);
      const skillGroups = Object.entries(Object.groupBy(skills, sk => sk.category || 'Competencias Clave'));
      const languages = visible(cv.languages);

      /* PMI Talent Triangle®: promedio de las habilidades cuya categoría nombra cada lado */
      const triangle = TALENT_TRIANGLE.map(label => {
        const group = skills.filter(sk => String(sk.category || '').toLowerCase().includes(label.toLowerCase()));
        return group.length ? [label, Math.round(group.reduce((sum, sk) => sum + percent(sk.level), 0) / group.length)] : null;
      }).filter(Boolean);

      const bar = (value) => `<div class="progress-track"><div class="progress-fill" style="width:${percent(value)}%;"></div></div>`;

      const body = `
        <div class="print-only-header">
          <div><strong>${escapeHTML(profile.full_name)}</strong>${profile.headline ? ` — ${escapeHTML(profile.headline)}` : ''}</div>
          ${settings.show_print_date ? `<div>Fecha de impresión: <span class="js-print-date">${todayText()}</span></div>` : ''}
        </div>

        ${(!isPreview && sections.length) ? `
          <nav class="cv-subnav no-print" aria-label="Secciones de la hoja de vida">
            <div class="section-anchors">
              ${sections.map(sec => `<a href="#sec-${sec.section_key}" class="section-anchor" data-section-link="${sec.section_key}">${escapeHTML(sec.title)}</a>`).join('')}
            </div>
            <div class="accordion-controls">
              <button type="button" class="btn btn-secondary btn-sm" data-toggle-all="open"><i data-lucide="chevrons-down"></i> Expandir todo</button>
              <button type="button" class="btn btn-secondary btn-sm" data-toggle-all="close"><i data-lucide="chevrons-up"></i> Plegar todo</button>
            </div>
          </nav>` : ''}

        <div class="cv-layout ${settings.layout === 'single' ? 'single-column' : ''}">
          <aside class="cv-sidebar">
            <section class="cv-card hero-profile" aria-label="Datos principales">
              ${avatarHTML(profile, 'hero-avatar')}
              <h1 class="hero-name">${escapeHTML(profile.full_name || 'Nombre completo')}</h1>
              <p class="hero-headline">${escapeHTML(profile.headline)}</p>
              ${profile.location ? `<span class="hero-location"><i data-lucide="map-pin" style="width:15px;height:15px;"></i> ${escapeHTML(profile.location)}</span>` : ''}

              <div class="contact-list">
                ${profile.email ? `<div class="contact-item"><i data-lucide="mail" style="width:16px;height:16px;"></i> <a href="mailto:${escapeHTML(profile.email)}">${escapeHTML(profile.email)}</a></div>` : ''}
                ${profile.phone ? `<div class="contact-item"><i data-lucide="phone" style="width:16px;height:16px;"></i> <a href="tel:${escapeHTML(profile.phone)}">${escapeHTML(profile.phone)}</a></div>` : ''}
                ${safeURL(profile.linkedin_url) ? `<div class="contact-item"><i data-lucide="linkedin" style="width:16px;height:16px;"></i> <a href="${escapeHTML(safeURL(profile.linkedin_url))}" target="_blank" rel="noopener noreferrer">Perfil de LinkedIn</a></div>` : ''}
                ${safeURL(profile.website_url) ? `<div class="contact-item"><i data-lucide="globe" style="width:16px;height:16px;"></i> <a href="${escapeHTML(safeURL(profile.website_url))}" target="_blank" rel="noopener noreferrer">Portafolio web</a></div>` : ''}
              </div>

              ${!isPreview ? `
                <div class="hero-actions">
                  <button type="button" class="btn btn-primary" id="btn-print-cv"><i data-lucide="printer"></i> Imprimir / PDF</button>
                  <button type="button" class="btn btn-secondary" id="btn-share-cv"><i data-lucide="share-2"></i> Compartir</button>
                  <a href="#/editar/${encodeURIComponent(profile.slug)}" class="btn btn-secondary" style="grid-column:1 / -1;"><i data-lucide="pencil"></i> Editar hoja de vida</a>
                </div>` : ''}
            </section>

            ${skills.length ? `
              <section class="cv-card" aria-label="Competencias y habilidades">
                <h2 style="font-size:1.02rem; font-weight:700; margin-bottom:1rem; display:flex; align-items:center; gap:0.5rem;">
                  <i data-lucide="cpu" style="color:var(--primary);"></i> Competencias Clave
                </h2>
                ${skillGroups.map(([category, list]) => `
                  <div class="skill-group">
                    <div class="skill-group-title">${escapeHTML(category)}</div>
                    ${list.map(sk => `
                      <div class="skill-item">
                        <div class="skill-label">
                          <span>${iconHTML(sk.icon || 'check-circle', 13, 'vertical-align:middle;color:var(--primary);')} ${escapeHTML(sk.name)}</span>
                          <span>${percent(sk.level)}%</span>
                        </div>
                        ${bar(sk.level)}
                      </div>
                    `).join('')}
                  </div>
                `).join('')}

                ${(settings.show_talent_triangle && triangle.length) ? `
                  <div class="talent-triangle-box">
                    <strong style="font-size:0.84rem; display:flex; align-items:center; gap:0.4rem; color:var(--primary);">
                      <i data-lucide="triangle" style="width:15px;height:15px;"></i> PMI Talent Triangle®
                    </strong>
                    <div class="triangle-bars">
                      ${triangle.map(([label, value]) => `
                        <div>
                          <div style="display:flex; justify-content:space-between; font-size:0.78rem; font-weight:600;">
                            <span>${label}</span><span>${value}%</span>
                          </div>
                          ${bar(value)}
                        </div>
                      `).join('')}
                    </div>
                  </div>` : ''}
              </section>` : ''}

            ${languages.length ? `
              <section class="cv-card" aria-label="Idiomas">
                <h2 style="font-size:1.02rem; font-weight:700; margin-bottom:0.85rem; display:flex; align-items:center; gap:0.5rem;">
                  <i data-lucide="languages" style="color:var(--primary);"></i> Idiomas
                </h2>
                ${languages.map(lang => `
                  <div class="skill-item">
                    <div class="skill-label">
                      <strong>${escapeHTML(lang.name)}</strong>
                      <span style="color:var(--text-muted);">${escapeHTML(lang.level)}</span>
                    </div>
                    ${bar(lang.percentage)}
                  </div>
                `).join('')}
              </section>` : ''}
          </aside>

          <div class="cv-main-content">
            ${sections.map(sec => {
              const count = countable[sec.section_key] ? visible(cv[countable[sec.section_key]]).length : null;
              return `
                <details id="sec-${sec.section_key}" class="cv-section" ${sec.start_collapsed ? '' : 'open'}>
                  <summary class="cv-section-header">
                    <div class="section-title-wrap">
                      <span class="section-icon-box">${iconHTML(sec.icon || 'layers', 18)}</span>
                      <span>${escapeHTML(sec.title)}</span>
                    </div>
                    <div class="section-meta">
                      ${count !== null ? `<span class="count-pill">${count} ${count === 1 ? 'elemento' : 'elementos'}</span>` : ''}
                      <i data-lucide="chevron-down" class="chevron-icon"></i>
                    </div>
                  </summary>
                  <div class="cv-section-body">${sec.html}</div>
                </details>`;
            }).join('')}
          </div>
        </div>
      `;

      if (isPreview) return body;

      /* Tabla de impresión: el encabezado y el pie vacíos son el margen de cada página */
      return `
        <table class="print-frame" role="presentation">
          <thead><tr><td><div class="print-space"></div></td></tr></thead>
          <tbody><tr><td>${body}</td></tr></tbody>
          <tfoot><tr><td><div class="print-space"></div></td></tr></tfoot>
        </table>`;
    }

    function openShareModal(profile) {
      const shareURL = `${window.location.href.split('#')[0]}#/cv/${encodeURIComponent(profile.slug)}`;
      const text = `Conoce la hoja de vida de ${profile.full_name}${profile.headline ? ` (${profile.headline})` : ''}`;
      const body = openModal('Compartir hoja de vida', `
        <div class="share-grid">
          <button type="button" class="btn btn-primary" id="share-copy"><i data-lucide="copy"></i> Copiar enlace</button>
          <a href="https://wa.me/?text=${encodeURIComponent(text + ' ' + shareURL)}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary"><i data-lucide="message-circle"></i> WhatsApp</a>
          <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareURL)}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary"><i data-lucide="linkedin"></i> LinkedIn</a>
          <a href="mailto:?subject=${encodeURIComponent(text)}&body=${encodeURIComponent(shareURL)}" class="btn btn-secondary"><i data-lucide="mail"></i> Correo</a>
        </div>
        ${navigator.share ? `<button type="button" class="btn btn-accent" id="share-native" style="width:100%; margin-top:0.6rem;"><i data-lucide="share-2"></i> Compartir desde el dispositivo</button>` : ''}
      `);
      body.querySelector('#share-copy').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(shareURL);
          showToast('Enlace copiado al portapapeles');
        } catch {

      body.querySelector('#share-native')?.addEventListener('click', () => {

    function fieldHTML(field, obj) {
      const value = obj[field.key];
      const attrs = `data-field="${field.key}" data-type="${field.type || 'text'}"`;
      const hint = field.hint ? `<span class="hint">${field.hint}</span>` : '';
      let control;

      switch (field.type) {
        case 'checkbox':
          return `<label class="check-row"><input type="checkbox" ${attrs} ${value ? 'checked' : ''} /> ${field.label}</label>`;
        case 'textarea':
          control = `<textarea class="form-control" rows="${field.rows || 3}" ${attrs}>${escapeHTML(value)}</textarea>`;
          break;
        case 'lines':
          control = `<textarea class="form-control" rows="${field.rows || 3}" ${attrs}>${escapeHTML(toArray(value).join('\n'))}</textarea>`;
          break;
        case 'csv':
          control = `<input class="form-control" ${attrs} value="${escapeHTML(toArray(value, ',').join(', '))}" />`;
          break;
        case 'select':
          control = `<select class="form-control" ${attrs}>${field.options.map(([val, text]) => `<option value="${escapeHTML(val)}" ${val === value ? 'selected' : ''}>${escapeHTML(text)}</option>`).join('')}</select>`;
          break;
        case 'number':
          control = `<input type="number" class="form-control" ${attrs} value="${Number(value) || 0}" />`;
          break;
        case 'color':
          control = `<input type="color" class="form-control" style="height:42px;" ${attrs} value="${escapeHTML(value)}" />`;
          break;
        case 'image':
          control = `
            <div class="img-field">
              <input class="form-control" ${attrs} value="${escapeHTML(value)}" placeholder="foto.jpg" />
              <label class="btn btn-secondary btn-sm"><i data-lucide="image"></i> Elegir<input type="file" accept="image/*" hidden data-pick /></label>
            </div>
            <span class="hint">${IMAGE_HINT}</span>`;
          break;
        default:
          control = `<input class="form-control" ${attrs} value="${escapeHTML(value)}" />`;
      }
      return `<div class="form-group ${field.wide ? 'wide' : ''}"><label>${field.label}</label>${control}${hint}</div>`;
    }

    /* Conecta los campos generados con fieldHTML al objeto que editan */
    function bindFields(container, getTarget, onChange) {
      container.querySelectorAll('[data-field]').forEach(el => {
        el.addEventListener('input', () => {
          const target = getTarget();
          const key = el.dataset.field;
          switch (el.dataset.type) {
            case 'checkbox': target[key] = el.checked; break;
            case 'number': target[key] = Number(el.value) || 0; break;
            case 'lines': target[key] = toArray(el.value); break;
            case 'csv': target[key] = toArray(el.value, ','); break;
            default: target[key] = el.value.trim();
          }
          onChange(key);
        });
      });

      /* "Elegir": anota el nombre del archivo y lo muestra en la vista previa de esta sesión */
      container.querySelectorAll('[data-pick]').forEach(picker => {
        picker.addEventListener('change', () => {
          const file = picker.files[0];
          if (!file) return;
          sessionImages.set(file.name, URL.createObjectURL(file));
          const input = picker.closest('.img-field').querySelector('[data-field]');
          input.value = file.name;
          input.dispatchEvent(new Event('input'));
          showToast(`Recuerda copiar «${file.name}» en la misma carpeta de index.html`);
          picker.value = '';
        });
      });
    }

        $('editor-topbar').innerHTML = `

      async function save() {
        const profile = cv.profile;
        if (!profile.full_name) {
          showToast('Escribe el nombre completo antes de guardar');
          return;
        }
        profile.slug = slugify(profile.slug || profile.full_name) || `cv-${Date.now()}`;
        try {
          await store.save(cv, savedSlug);
        } catch (err) {
          showToast(`No se pudo guardar: ${err.message}`);
          return;
        }
        savedSlug = profile.slug;
        editorDirty = false;
        history.replaceState(null, '', `#/editar/${encodeURIComponent(savedSlug)}`);
        renderTopbar();
        renderForm();
        showToast(store.mode === 'supabase' ? 'Hoja de vida guardada en la base de datos' : 'Hoja de vida guardada en este navegador');

      async function remove() {
        const ok = await confirmModal('Eliminar hoja de vida', `Se eliminará la hoja de vida de ${cv.profile.full_name}. Esta acción no se puede deshacer.`, 'Eliminar', true);
        if (!ok) return;
        try {
          await store.remove(savedSlug);

          showToast(`No se pudo eliminar: ${err.message}`);
          return;

        editorDirty = false;
        showToast('Hoja de vida eliminada');

      /* Importar: carga el JSON en el editor; se agrega a la base de datos al pulsar Guardar */
      $('import-file').onchange = async (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;

        let imported;
        try {
          const raw = parseCommentedJSON(await file.text());
          if (!isObject(raw) || !isObject(raw.profile)) throw new Error('no contiene el apartado "profile" de una hoja de vida');
          imported = normalizeCV(raw);

          showToast(`No se pudo importar el archivo: ${err.message}`);
          return;

        if (savedSlug || editorDirty) {
          const ok = await confirmModal('Importar JSON', 'Los datos del archivo reemplazarán todo el contenido que ves en el editor.', 'Reemplazar');
          if (!ok) return;
        }
        /* Al editar una hoja de vida existente se conserva su enlace */
        if (savedSlug) imported.profile.slug = savedSlug;

        cv = imported;
        editingIndex = -1;
        renderForm();

            ${editingIndex === i ? `<div class="item-form"><div class="form-grid">${cfg.fields.map(f => fieldHTML(f, item)).join('')}</div></div>` : ''}
          `).join('')}
          <button type="button" class="btn btn-primary" id="add-item" style="margin-top:0.5rem;"><i data-lucide="plus"></i> Agregar</button>
        `;

        bindFields(area, () => list[editingIndex], (field) => {
          const item = list[editingIndex];
          if (field === cfg.main) area.querySelector(`[data-row-title="${editingIndex}"]`).textContent = item[cfg.main] || '(sin título)';
          if (field === cfg.sub) area.querySelector(`[data-row-sub="${editingIndex}"]`).textContent = item[cfg.sub];
          touch();
        });

        area.querySelectorAll('[data-visible]').forEach(cb => cb.addEventListener('change', () => {
          list[Number(cb.dataset.visible)].is_visible = cb.checked;
          touch();
        }));
        area.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
          const i = Number(btn.dataset.edit);
          editingIndex = editingIndex === i ? -1 : i;
          renderForm();
        }));
        area.querySelectorAll('[data-move]').forEach(btn => btn.addEventListener('click', () => {
          if (!moveItem(list, Number(btn.dataset.move), Number(btn.dataset.dir))) return;
          editingIndex = -1;
          renderForm();
          touch();
        }));
        area.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => {
          list.splice(Number(btn.dataset.delete), 1);
          editingIndex = -1;
          renderForm();
          touch();
        }));
        $('add-item').addEventListener('click', () => {
          const item = { is_visible: true, ...structuredClone(cfg.defaults || {}) };
          cfg.fields.forEach(f => { item[f.key] ??= ''; });
          list.push(item);
          editingIndex = list.length - 1;
          renderForm();
          touch();
        });
      }

      function renderAppearanceForm(area) {
        area.innerHTML = `
          <h2 style="margin-bottom:1rem;">Apariencia</h2>
          <div class="form-grid" id="settings-fields">${SETTINGS_FIELDS.map(f => fieldHTML(f, cv.settings)).join('')}</div>

          <h3 style="margin:1.25rem 0 0.3rem; font-size:1rem;">Orden, títulos e íconos de las secciones</h3>
          <p class="hint" style="margin-bottom:0.6rem;">Ícono: ${ICON_HINT.toLowerCase()}.</p>
          ${cv.sections.map((sec, i) => `
            <div class="crud-item-row" style="flex-wrap:wrap;">
              <div style="display:flex; align-items:center; gap:0.5rem; flex:1; min-width:220px;">
                <input type="checkbox" data-sec="${i}" data-prop="is_visible" ${sec.is_visible !== false ? 'checked' : ''} title="Mostrar u ocultar la sección" />
                <input class="form-control" data-sec="${i}" data-prop="title" value="${escapeHTML(sec.title)}" style="flex:1; min-width:0;" aria-label="Título de la sección" />
                <input class="form-control" data-sec="${i}" data-prop="icon" value="${escapeHTML(sec.icon)}" style="width:120px;" aria-label="Ícono de la sección" />
              </div>
              <div style="display:flex; gap:0.35rem; align-items:center;">
                <label style="font-size:0.75rem;"><input type="checkbox" data-sec="${i}" data-prop="start_collapsed" ${sec.start_collapsed ? 'checked' : ''} /> Inicia plegada</label>
                <button type="button" class="btn btn-secondary btn-sm" data-sec-move="${i}" data-dir="-1" title="Subir">↑</button>
                <button type="button" class="btn btn-secondary btn-sm" data-sec-move="${i}" data-dir="1" title="Bajar">↓</button>
              </div>
            </div>
          `).join('')}
        `;

        bindFields($('settings-fields'), () => cv.settings, touch);

        area.querySelectorAll('[data-sec]').forEach(el => el.addEventListener('input', () => {
          cv.sections[Number(el.dataset.sec)][el.dataset.prop] = el.type === 'checkbox' ? el.checked : el.value.trim();
          touch();
        }));
        area.querySelectorAll('[data-sec-move]').forEach(btn => btn.addEventListener('click', () => {
          if (!moveItem(cv.sections, Number(btn.dataset.secMove), Number(btn.dataset.dir))) return;
          renderForm();
          touch();
        }));
      }

      function renderForm() {
        const area = $('editor-form');
        document.querySelectorAll('.editor-tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === activeTab));

        if (activeTab === 'personal' || activeTab === 'media') {
          const personal = activeTab === 'personal';
          area.innerHTML = `
            <h2 style="margin-bottom:1rem;">${personal ? 'Datos personales y perfil' : 'Video de presentación y anexos'}</h2>
            <div class="form-grid">${(personal ? PROFILE_FIELDS : MEDIA_FIELDS).map(f => fieldHTML(f, cv.profile)).join('')}</div>
          `;
          bindFields(area, () => cv.profile, touch);
        } else if (activeTab === 'appearance') {
          renderAppearanceForm(area);
        } else {
          renderCollectionForm(area, activeTab);
        }
        refreshIcons();
      }

      document.querySelectorAll('.editor-tab-btn').forEach(btn => btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        editingIndex = -1;
        renderForm();
      }));

      renderTopbar();
      renderForm();
      renderPreview();
    }

    /* ==========================================================================
       10. ENRUTADOR (#/  ·  #/cv/{slug}  ·  #/nueva  ·  #/editar/{slug})
       ========================================================================== */
    async function router() {
      const token = ++routeToken;
      const hash = window.location.hash || '#/';
      const slugAfter = (prefix) => decodeURIComponent(hash.slice(prefix.length).trim());

      closeModal();
      editorDirty = false;
      window.scrollTo(0, 0);

      if (hash.startsWith('#/cv/')) await renderCVView(slugAfter('#/cv/'), token);
      else if (hash === '#/nueva') await renderEditorView(null, token);
      else if (hash.startsWith('#/editar/')) await renderEditorView(slugAfter('#/editar/'), token);
      else await renderDirectoryView(token);
    }

    window.addEventListener('hashchange', router);
    refreshIcons();
    router();
  </script>
</body>
</html>
